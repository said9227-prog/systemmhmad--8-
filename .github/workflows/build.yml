name: Build Debug APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      ANDROID_SDK_ROOT: "${{ runner.temp }}/android-sdk"
      ANDROID_HOME: "${{ runner.temp }}/android-sdk"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =====================================================
      # Install Android Command-line Tools manually
      # =====================================================
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$ANDROID_SDK_ROOT"
          CMDLINE_TOOLS_VERSION="11076708"

          echo "Android SDK: $SDK_ROOT"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          echo "Downloading Android Command-line Tools..."

          curl -fL \
            "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" \
            -o "$RUNNER_TEMP/cmdline-tools.zip"

          rm -rf "$RUNNER_TEMP/cmdline-tools"
          mkdir -p "$RUNNER_TEMP/cmdline-tools"

          unzip -q \
            "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$RUNNER_TEMP/cmdline-tools"

          rm -rf "$SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          cp -R \
            "$RUNNER_TEMP/cmdline-tools/cmdline-tools/"* \
            "$SDK_ROOT/cmdline-tools/latest/"

          rm -rf "$RUNNER_TEMP/cmdline-tools"
          rm -f "$RUNNER_TEMP/cmdline-tools.zip"

          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "Command-line Tools installed."

          echo "sdkmanager version:"
          sdkmanager --version

      # =====================================================
      # Accept Android licenses
      # =====================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses

      # =====================================================
      # Install Android SDK components
      # =====================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "Installing Android SDK packages..."

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platforms;android-36"

          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "build-tools;36.0.0"

          echo "Android SDK packages installed successfully."

      # =====================================================
      # Verify Android SDK
      # =====================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "========================================"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "========================================"

          echo "sdkmanager version:"
          sdkmanager --version

          echo ""
          echo "Installed packages:"
          sdkmanager --list_installed

          echo ""
          echo "Checking platform..."

          test -d \
            "$ANDROID_SDK_ROOT/platforms/android-36"

          echo "Android 36 platform: OK"

          echo ""
          echo "Checking build-tools..."

          test -d \
            "$ANDROID_SDK_ROOT/build-tools/36.0.0"

          echo "Build Tools 36.0.0: OK"

          echo ""
          echo "Android SDK verification successful."

      # =====================================================
      # Gradle
      # =====================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # =====================================================
      # Environment files
      # =====================================================
      - name: Prepare environment and secrets files
        shell: bash
        run: |
          touch .env
          touch .env.example

          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

      # =====================================================
      # Gradle Wrapper
      # =====================================================
      - name: Ensure gradlew executable
        shell: bash
        run: |
          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew is missing from the repository."
            exit 1
          fi

          chmod +x gradlew

      # =====================================================
      # Build APK
      # =====================================================
      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      # =====================================================
      # Upload APK
      # =====================================================
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
          if-no-files-found: error
